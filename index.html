<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d5dfc" />
    <meta name="description" content="TeacherScreen – interaktívna tabuľa s widgetmi pre učiteľov" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>TeacherScreen</title>
    <script>
      // Nastavenie témy pred vykreslením, aby neblikalo.
      try {
        var t = JSON.parse(localStorage.getItem('ts.settings') || '{}').theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TeacherScreen vyžaduje zapnutý JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
